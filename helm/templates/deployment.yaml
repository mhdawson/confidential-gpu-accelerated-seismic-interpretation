apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: "{{ .Values.initdata }}"
        io.katacontainers.config.hypervisor.default_memory: "{{ .Values.kataMemoryMiB }}"
        io.katacontainers.config.hypervisor.kernel_params: "agent.guest_components_rest_api=all"
    spec:
      automountServiceAccountToken: false
      runtimeClassName: {{ .Values.runtimeClassName }}
      terminationGracePeriodSeconds: 120
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      initContainers:
        - name: model-init
          image: {{ .Values.modelcar.image }}
          imagePullPolicy: Always
          command: ["/bin/cp", "-r", "/model/.", "/models-cache/"]
          volumeMounts:
            - name: models-cache
              mountPath: /models-cache
      containers:
        - name: app
          image: {{ .Values.app.image }}
          imagePullPolicy: Always
          command: ["/bin/bash", "-c", "bash /app/decrypt.sh && python /app/app.py"]
          ports:
            - containerPort: 7860
              protocol: TCP
          env:
            - name: PORT
              value: "7860"
            - name: KBS_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: models-cache
              mountPath: /models-cache
          readinessProbe:
            httpGet:
              path: /
              port: 7860
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: models-cache
          emptyDir:
            medium: Memory
