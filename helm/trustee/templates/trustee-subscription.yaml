# installPlanApproval: Manual — prevents automatic upgrades from disrupting
# a running attestation service. The make target approves the InstallPlan
# after subscription creation.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: trustee-operator
  namespace: trustee-operator-system
spec:
  channel: stable
  name: trustee-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: trustee-operator.v1.2.0
  installPlanApproval: Manual
  config:
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 128Mi
