# Enables Intel TDX in the kernel and loads the vsock-loopback module required
# by the kata agent for host-guest communication.
# Also drops config.d overrides to disable vsock quote generation (port=0),
# directing the kata runtime to use kernel-mediated TDX quote generation via
# the QGS unix socket instead (required for OSC 1.13+).
# Default role: master (single-node / SNO).  For multi-node clusters where
# kata workloads run on worker nodes, change the role label to "worker".
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-enable-intel-tdx
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.5.0
    storage:
      files:
        - path: /etc/modules-load.d/vsock.conf
          mode: 0644
          contents:
            source: "data:,vsock-loopback%0A"
        - path: /etc/kata-containers/kata-tdx/config.d/96-kata-kernel-config
          mode: 0644
          contents:
            source: "data:text/plain;charset=utf-8;base64,W2h5cGVydmlzb3IucWVtdV0KdGR4X3F1b3RlX2dlbmVyYXRpb25fc2VydmljZV9zb2NrZXRfcG9ydD0wCg=="
        - path: /etc/kata-containers/kata-tdx-nvidia-gpu/config.d/96-kata-kernel-config
          mode: 0644
          contents:
            source: "data:text/plain;charset=utf-8;base64,W2h5cGVydmlzb3IucWVtdV0KdGR4X3F1b3RlX2dlbmVyYXRpb25fc2VydmljZV9zb2NrZXRfcG9ydD0wCg=="
  kernelArguments:
    - kvm_intel.tdx=1
    - nohibernate
