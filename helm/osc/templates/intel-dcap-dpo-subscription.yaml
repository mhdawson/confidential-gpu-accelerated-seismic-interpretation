# installPlanApproval: Manual — prevents automatic upgrades disrupting running
# DaemonSets. The make target approves the InstallPlan after subscription creation.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: intel-device-plugins-operator
  namespace: intel-dcap
spec:
  channel: stable
  name: intel-device-plugins-operator
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
