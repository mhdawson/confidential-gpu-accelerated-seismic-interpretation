app:
  image: quay.io/rh-ai-quickstart/conf-gpu-accel-seismic-interp-deepseismic-app:0.1.0

modelcar:
  image: quay.io/rh-ai-quickstart/conf-gpu-accel-seismic-interp-deepseismic-model:0.1.0

runtimeClassName: kata-cc-nvidia-gpu

# Built and encoded by make install — do not set manually.
initdata: ""

# KBS route URL — substituted into initdata at make install time.
kbsUrl: ""

tolerations: []

# Initial RAM (MiB) for the kata VM. CDH unpacks all container images into
# the VM's tmpfs before containers start, so this must exceed the total
# uncompressed size of all images pulled inside the VM.
# The app image is ~8.5 GB compressed. Both images must unpack into the VM's tmpfs.
kataMemoryMiB: 49152   # 48 GB

resources:
  limits:
    nvidia.com/pgpu: "1"
    cpu: "8"
    memory: 32Gi
  requests:
    nvidia.com/pgpu: "1"
    cpu: "4"
    memory: 24Gi
